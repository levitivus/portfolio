<!DOCTYPE html>
<html lang="en">
<head>
  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-BFQC87WKPS"></script>
  <script>

  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CLASSIFIED ARCHIVE // SECURE_NODE_1092</title>
  <style>
    /* ── BASE CRT SCREEN STYLING ───────────────────────────────────────── */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #000000;
      color: #00ff66;
      font-family: 'JetBrains Mono', 'Courier New', Courier, monospace;
      height: 100vh;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
    }

    /* Outer CRT Screen Container */
    .screen {
      width: 100%;
      height: 100%;
      padding: 30px;
      position: relative;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      background: radial-gradient(circle, rgba(10, 25, 12, 0.4) 0%, rgba(0, 0, 0, 1) 100%);
      animation: crt-flicker 0.18s infinite;
    }

    /* Scanlines Overlay */
    .screen::before {
      content: " ";
      display: block;
      position: absolute;
      top: 0; left: 0; bottom: 0; right: 0;
      background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.3) 50%), 
                  linear-gradient(90deg, rgba(255, 0, 0, 0.05), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.05));
      z-index: 20;
      background-size: 100% 4px, 6px 100%;
      pointer-events: none;
    }

    /* Vignette Shadow for screen curvature */
    .screen::after {
      content: " ";
      display: block;
      position: absolute;
      top: 0; left: 0; bottom: 0; right: 0;
      background: radial-gradient(circle, transparent 65%, rgba(0, 0, 0, 0.85) 100%);
      z-index: 21;
      pointer-events: none;
    }

    /* CRT Flicker Keyframes */
    @keyframes crt-flicker {
      0% { opacity: 0.985; }
      50% { opacity: 0.995; }
      100% { opacity: 0.985; }
    }

    /* Horizontal Glitch Sweep Line */
    .glitch-line {
      position: absolute;
      left: 0;
      width: 100%;
      height: 4px;
      background: rgba(0, 255, 102, 0.25);
      box-shadow: 0 0 10px rgba(0, 255, 102, 0.5);
      z-index: 22;
      pointer-events: none;
      animation: sweep 6s linear infinite;
    }

    @keyframes sweep {
      0% { top: -10%; }
      100% { top: 110%; }
    }

    /* Glowing Text Effect */
    .text-glow {
      text-shadow: 0 0 4px rgba(0, 255, 102, 0.65), 0 0 10px rgba(0, 255, 102, 0.35);
    }

    /* ── LAYOUT SECTIONS ──────────────────────────────────────────────── */
    .terminal-header {
      display: flex;
      justify-content: space-between;
      font-size: 12px;
      letter-spacing: 1.5px;
      border-bottom: 1px solid rgba(0, 255, 102, 0.3);
      padding-bottom: 8px;
      color: rgba(0, 255, 102, 0.7);
    }

    .terminal-footer {
      display: flex;
      justify-content: space-between;
      font-size: 11px;
      letter-spacing: 1px;
      border-top: 1px solid rgba(0, 255, 102, 0.3);
      padding-top: 8px;
      color: rgba(0, 255, 102, 0.6);
    }

    .terminal-body {
      flex-grow: 1;
      padding-block: 20px;
      font-size: 15px;
      line-height: 1.7;
      overflow-y: auto;
      max-width: 800px;
      width: 100%;
      margin-inline: auto;
    }

    /* Access Granted Banner */
    .access-granted {
      color: #ffffff;
      background-color: rgba(0, 255, 102, 0.2);
      border: 1px solid rgba(0, 255, 102, 0.8);
      display: inline-block;
      padding: 4px 12px;
      font-weight: bold;
      border-radius: 3px;
      letter-spacing: 3px;
      margin-block: 10px;
      text-shadow: 0 0 8px #ffffff;
      box-shadow: 0 0 15px rgba(0, 255, 102, 0.2);
    }

    /* Blinking Terminal Cursor */
    .cursor {
      display: inline-block;
      width: 8px;
      height: 15px;
      background-color: #00ff66;
      margin-left: 5px;
      animation: blink 0.8s infinite;
      vertical-align: middle;
      box-shadow: 0 0 5px rgba(0, 255, 102, 0.8);
    }

    @keyframes blink {
      0%, 49% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }

    /* ── CINEMATIC TRANSITIONS & VIDEO OVERLAY ────────────────────────── */
    #fade-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: #000000;
      opacity: 0;
      z-index: 9999;
      pointer-events: none;
      transition: opacity 1.5s ease-in-out;
    }

    #fade-overlay.black {
      opacity: 1;
    }

    /* Terminal HUD Wrapper */
    .terminal-hud {
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      height: 100%;
      width: 100%;
      transition: opacity 1s ease-in-out;
    }
    .terminal-hud.fade-out {
      opacity: 0;
      pointer-events: none;
    }

    /* Video Replication Grid */
    .video-grid-container {
      position: absolute;
      top: 30px;
      left: 30px;
      right: 30px;
      bottom: 30px;
      display: grid;
      place-items: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 1s ease-in-out;
      z-index: 10;
    }
    .video-grid-container.show {
      opacity: 1;
      pointer-events: auto;
    }

    /* Warning Screen Styling */
    .warning-screen {
      position: absolute;
      top: 30px;
      left: 30px;
      right: 30px;
      bottom: 30px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 1s ease-in-out;
      z-index: 30;
    }
    .warning-screen.show {
      opacity: 1;
      pointer-events: auto;
    }
    .warning-title {
      font-size: 24px;
      font-weight: bold;
      letter-spacing: 2px;
      color: #ff3333;
      border: 1px solid #ff3333;
      padding: 10px 20px;
      background: rgba(255, 51, 51, 0.1);
      box-shadow: 0 0 15px rgba(255, 51, 51, 0.2);
      margin-bottom: 25px;
      text-shadow: 0 0 8px #ff3333;
    }
    .warning-line {
      font-size: 16px;
      color: #00ff66;
      line-height: 1.8;
    }

    /* Shaking & Distorting Screen animations */
    .shake-screen {
      animation: shake 0.15s infinite, distort 0.3s infinite;
    }

    @keyframes shake {
      0% { transform: translate(2px, 1px) rotate(0deg); }
      10% { transform: translate(-1px, -2px) rotate(-1deg); }
      20% { transform: translate(-3px, 0px) rotate(1deg); }
      30% { transform: translate(0px, 2px) rotate(0deg); }
      40% { transform: translate(1px, -1px) rotate(1deg); }
      50% { transform: translate(-1px, 2px) rotate(-1deg); }
      60% { transform: translate(-3px, 1px) rotate(0deg); }
      70% { transform: translate(2px, 1px) rotate(-1deg); }
      80% { transform: translate(-1px, -1px) rotate(1deg); }
      90% { transform: translate(2px, 2px) rotate(0deg); }
      100% { transform: translate(1px, -2px) rotate(-1deg); }
    }

    @keyframes distort {
      0% { filter: hue-rotate(0deg) skewX(0deg) scale(1); }
      20% { filter: hue-rotate(45deg) skewX(-2deg) scale(1.01); }
      40% { filter: hue-rotate(90deg) skewX(2deg) scale(0.99) saturate(2); }
      60% { filter: hue-rotate(180deg) skewX(-3deg) scale(1.02) contrast(1.5); }
      80% { filter: hue-rotate(270deg) skewX(3deg) scale(0.98) saturate(3); }
      100% { filter: hue-rotate(360deg) skewX(0deg) scale(1); }
    }

    .goodbye-text {
      font-size: 48px;
      font-weight: bold;
      color: #ff3333;
      text-shadow: 0 0 10px #ff3333, 0 0 20px #ff0000;
      letter-spacing: 6px;
      margin-top: 30px;
      animation: pulse 0.4s infinite alternate;
    }

    @keyframes pulse {
      0% { transform: scale(1); }
      100% { transform: scale(1.08); }
    }

    /* Hide scrollbars for retro clean feel */
    ::-webkit-scrollbar {
      display: none;
    }
  </style>
</head>
<body>

  <!-- Retro Screen Filter -->
  <div class="screen" id="main-screen">
    <div class="glitch-line"></div>
    
    <!-- Terminal HUD Wrapper -->
    <div id="terminal-hud" class="terminal-hud">
      <!-- Top HUD Header -->
      <div class="terminal-header">
        <div>ARCHIVE_1998 // ACCESS LEVEL: 5 // CLASSIFIED</div>
        <div>SYS_TIME: <span id="timestamp">2026-07-11T09:14:10Z</span></div>
      </div>
      
      <!-- Active Output Area -->
      <div class="terminal-body text-glow" id="terminal-content">
        <!-- Content appended here dynamically -->
      </div>
      
      <!-- Bottom HUD Footer -->
      <div class="terminal-footer">
        <div>NODE: SCP_SECURE_1092 // WARNING: DO NOT DISTRIBUTE</div>
        <div>ADDR_REF: 0x00F8A7D2</div>
      </div>
    </div>

    <!-- Video Grid Container -->
    <div id="video-grid-container" class="video-grid-container"></div>

    <!-- Warning Screen Container -->
    <div id="warning-screen" class="warning-screen">
      <div id="warning-content" style="display: flex; flex-direction: column; align-items: center; width: 100%;"></div>
    </div>
  </div>

  <!-- Cinematic Transition Overlays -->
  <div id="fade-overlay"></div>

  <!-- ── SCRIPT LOGIC ────────────────────────────────────────────────── -->
  <script>
    // Update terminal clock with active timestamp
    function updateClock() {
      const clock = document.getElementById('timestamp');
      if (clock) {
        clock.textContent = new Date().toISOString().replace(/\.\d+Z$/, 'Z');
      }
    }
    setInterval(updateClock, 1000);
    updateClock();

    // Sequence of terminal lines and display logic
    const sequence = [
      { text: "ACCESSING HIDDEN NODE...", delay: 0 },
      { text: "Searching...", delay: 250 },
      { text: "Decrypting...", delay: 500 },
      { text: "Loading archive...", delay: 750 },
      { text: "Verifying visitor...", delay: 1000 },
      { text: "Authenticating...", delay: 1250 },
      { text: "ACCESS GRANTED", delay: 1550, class: "access-granted" },
      { text: "██████████████████████ 100%", delay: 1750 },
      { text: "Visitor Identified", delay: 2150 },
      { text: "Persistence Level: 100%", delay: 2350 },
      { text: "Curiosity: Maximum", delay: 2550 },
      { text: "Congratulations.", delay: 2850 },
      { text: "You successfully caught the hidden object.", delay: 3100 },
      { text: "Very few people ever reach this page.", delay: 3400 },
      { text: "Preparing reward...", delay: 3700 },
      { text: "Loading media...", delay: 4000 }
    ];

    const contentEl = document.getElementById('terminal-content');

    // Typewriter helper
    function typeLine(item) {
      return new Promise((resolve) => {
        const lineEl = document.createElement('div');
        if (item.class) {
          lineEl.className = item.class;
        } else {
          lineEl.style.marginBottom = '6px';
        }
        contentEl.appendChild(lineEl);
        
        let index = 0;
        const text = item.text;
        
        // Add a temporary inline cursor to the line being typed
        const lineCursor = document.createElement('span');
        lineCursor.className = 'cursor';
        lineEl.appendChild(lineCursor);

        function type() {
          if (index < text.length) {
            // Insert character before the cursor
            lineCursor.insertAdjacentText('beforebegin', text[index]);
            index++;
            setTimeout(type, 8); // Fast typing speed
          } else {
            // Remove cursor from this line and resolve
            lineCursor.remove();
            
            // Add a static final blinking cursor at the very end of the terminal content
            let finalCursor = document.getElementById('global-cursor');
            if (!finalCursor) {
              finalCursor = document.createElement('span');
              finalCursor.id = 'global-cursor';
              finalCursor.className = 'cursor';
            }
            lineEl.appendChild(finalCursor);
            
            resolve();
          }
        }
        
        // Handle immediate render for bar graph
        if (text.startsWith('█')) {
          lineCursor.insertAdjacentText('beforebegin', text);
          lineCursor.remove();
          lineEl.appendChild(document.getElementById('global-cursor') || Object.assign(document.createElement('span'), {id: 'global-cursor', className: 'cursor'}));
          resolve();
        } else {
          type();
        }
      });
    }

    // Execute sequence timing
    async function runSequence() {
      for (const item of sequence) {
        await new Promise(r => setTimeout(r, item.delay - (sequence[sequence.indexOf(item) - 1]?.delay || 0)));
        await typeLine(item);
      }
      
      // Sequence completed!
      setTimeout(startVideoEnding, 800);
    }

    // Trigger the terminal sequences
    runSequence();

    // ── NEW ENDING SEQUENCE ───────────────────────────────────────────
    let currentGen = 1;
    let videosFinished = 0;
    let genTimeout;

    function startVideoEnding() {
      const hud = document.getElementById('terminal-hud');
      const grid = document.getElementById('video-grid-container');
      
      // 1. Fade away terminal HUD
      hud.classList.add('fade-out');
      
      // 2. Wait for HUD fade out, then fade in video container and start Gen 1
      setTimeout(() => {
        grid.classList.add('show');
        startGeneration(1);
      }, 1000);
    }

    function updateGridTemplate(count) {
      let cols, rows;
      if (count === 1) { cols = 1; rows = 1; }
      else if (count === 2) { cols = 2; rows = 1; }
      else if (count === 4) { cols = 2; rows = 2; }
      else if (count === 8) { cols = 4; rows = 2; }
      else if (count === 16) { cols = 4; rows = 4; }
      else if (count === 32) { cols = 8; rows = 4; }
      
      const grid = document.getElementById('video-grid-container');
      grid.style.gridTemplateColumns = `repeat(${cols}, 1fr)`;
      grid.style.gridTemplateRows = `repeat(${rows}, 1fr)`;
      grid.style.gap = count > 8 ? '5px' : '10px';
    }

    function startGeneration(count) {
      const grid = document.getElementById('video-grid-container');
      
      // Clear previous generation
      grid.innerHTML = '';
      
      // Set grid layout dimensions
      updateGridTemplate(count);
      
      videosFinished = 0;
      clearTimeout(genTimeout);
      
      // Fallback timeout to prevent getting stuck if ended event fails to fire (e.g. 13s)
      genTimeout = setTimeout(() => {
        console.warn("Generation timeout reached. Advancing automatically.");
        nextGeneration();
      }, 13000);
      
      for (let i = 0; i < count; i++) {
        const video = document.createElement('video');
        video.src = 'rickroll.mp4';
        video.autoplay = true;
        video.playsInline = true;
        video.muted = false;
        video.controls = false;
        video.preload = 'auto';
        
        video.style.width = '100%';
        video.style.height = '100%';
        video.style.objectFit = 'cover';
        video.style.border = '1px solid rgba(0, 255, 102, 0.4)';
        video.style.borderRadius = '2px';
        video.style.opacity = '0';
        video.style.transition = 'opacity 0.4s ease-in-out';
        
        // Handle play activation
        video.play().catch(err => {
          console.warn("Autoplay with audio blocked. Trying muted.", err);
          video.muted = true;
          video.play().catch(e => console.error("Muted playback failed:", e));
        });

        video.addEventListener('ended', () => {
          videosFinished++;
          if (videosFinished === count) {
            clearTimeout(genTimeout);
            nextGeneration();
          }
        });
        
        grid.appendChild(video);
        
        // Fade in smoothly
        setTimeout(() => {
          video.style.opacity = '1';
        }, 50);
      }
    }

    function nextGeneration() {
      if (currentGen === 1) {
        currentGen = 2;
      } else if (currentGen === 2) {
        currentGen = 4;
      } else if (currentGen === 4) {
        currentGen = 8;
      } else if (currentGen === 8) {
        currentGen = 16;
      } else if (currentGen === 16) {
        currentGen = 32;
      } else if (currentGen === 32) {
        triggerMemeticContainmentFailure();
        return;
      }
      startGeneration(currentGen);
    }

    async function triggerMemeticContainmentFailure() {
      clearTimeout(genTimeout);
      
      // 1. Fade out the video grid
      const grid = document.getElementById('video-grid-container');
      grid.classList.remove('show');
      
      // 2. Wait for fade out to complete, then clear grid
      await new Promise(r => setTimeout(r, 1000));
      grid.innerHTML = '';
      
      // 3. Show warning screen
      const warningScreen = document.getElementById('warning-screen');
      warningScreen.classList.add('show');
      
      const warnContent = document.getElementById('warning-content');
      warnContent.innerHTML = '';
      
      // Helper to append typed lines inside warning screen
      async function typeWarnLine(text, isHeader = false, isDelay = 500) {
        return new Promise(resolve => {
          const el = document.createElement(isHeader ? 'h1' : 'div');
          if (isHeader) {
            el.className = 'warning-title text-glow';
          } else {
            el.className = 'warning-line text-glow';
            el.style.marginBottom = '10px';
          }
          warnContent.appendChild(el);
          
          let index = 0;
          
          const lineCursor = document.createElement('span');
          lineCursor.className = 'cursor';
          el.appendChild(lineCursor);

          function type() {
            if (index < text.length) {
              lineCursor.insertAdjacentText('beforebegin', text[index]);
              index++;
              setTimeout(type, 15); // Fast typing
            } else {
              lineCursor.remove();
              setTimeout(resolve, isDelay);
            }
          }
          type();
        });
      }
      
      await typeWarnLine("⚠️ MEMETIC CONTAINMENT FAILURE ⚠️", true, 800);
      await typeWarnLine("Rick.exe has escaped containment.", false, 400);
      await typeWarnLine("Replication exceeded safe limits.", false, 400);
      await typeWarnLine("Reality integrity: 0%", false, 600);
      await typeWarnLine("Attempting emergency shutdown...", false, 1200);
      
      await typeWarnLine("Well...", false, 800);
      await typeWarnLine("You really shouldn't have clicked the mystery box.", false, 1500);
      
      // 4. Start browser shake and page distortion
      startGlitchCrasher();
    }

    async function startGlitchCrasher() {
      const screen = document.getElementById('main-screen');
      screen.classList.add('shake-screen');
      
      // Wait about 3 seconds
      await new Promise(r => setTimeout(r, 3000));
      
      // Clear warning content and show GOODBYE
      const warnContent = document.getElementById('warning-content');
      warnContent.innerHTML = '';
      
      const goodbyeEl = document.createElement('div');
      goodbyeEl.className = 'goodbye-text text-glow';
      goodbyeEl.textContent = 'GOODBYE.';
      warnContent.appendChild(goodbyeEl);
      
      // Wait 1.5 seconds for maximum dramatic effect
      await new Promise(r => setTimeout(r, 1500));
      
      // Close the window
      window.close();
      
      // If browser blocks window.close() (standard security), redirect to index.html
      setTimeout(() => {
        window.location.href = 'index.html';
      }, 100);
    }
  </script>
</body>
